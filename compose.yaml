services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kino
      POSTGRES_PASSWORD: kino
      POSTGRES_DB: kino
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - kino-db:/var/lib/postgresql/data
      - ./scripts/init-local-db.sql:/docker-entrypoint-initdb.d/10-supertokens.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kino -d kino -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 20
  supertokens:
    image: supertokens/supertokens-postgresql:11.3
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://kino:kino@postgres:5432/supertokens
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3567:3567"

volumes:
  kino-db:
